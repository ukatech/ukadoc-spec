site_name: UKADOC
site_description: 伺か関連コンテンツ作者向けリファレンス（SSP 公式仕様書）
site_url: https://ukatech.github.io/ukadoc-spec/
repo_url: https://github.com/ukatech/ukadoc-spec
repo_name: ukatech/ukadoc-spec
edit_uri: ""

# 原稿はリポジトリ直下にあるため、scripts/prepare_site.py で _site_src/ に写してからビルドする
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  # Zensical の既定は modern（新デザイン）。従来の見た目は classic
  variant: classic
  language: ja
  favicon: assets/favicon.ico
  features:
    - navigation.sections
    - navigation.prune
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: ja
  - awesome-nav

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - mdx_truly_sane_lists
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3
      # GitHub と同じく日本語の見出しをそのままアンカーにする
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    anchors: warn
