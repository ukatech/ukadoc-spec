site_name: UKADOC project
site_description: 伺か関連コンテンツ作者向けリファレンス（SSP 公式仕様書）
site_url: https://ukatech.shillest.net/ukadoc-spec/
repo_url: https://github.com/ukatech/ukadoc-spec
repo_name: ukatech/ukadoc-spec
edit_uri: ""

# 原稿はリポジトリ直下にあるため、scripts/prepare_site.py で _site_src/ に写してからビルドする
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  # Zensical の既定は modern（新デザイン）。従来の見た目は classic。
  # assets/extra.css は classic の class 名・変数（.md-typeset、--md-primary-fg-color など）を前提にしている
  variant: classic
  language: ja
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: ja
  - awesome-nav

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - mdx_truly_sane_lists
  # コードブロックの class に言語の名前（language-sakurascript など）を付ける。色は site_ext の Pygments レキサーが付ける
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3
      # GitHub と同じく日本語の見出しをそのままアンカーにする
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    anchors: warn
