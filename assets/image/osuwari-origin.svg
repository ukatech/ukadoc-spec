<svg xmlns="http://www.w3.org/2000/svg" viewBox="320 40 960 960" width="640" height="640" font-family="Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="24">
  <title>--origin=osuwari --target-origin=center.top で座ったときの、ゴーストのウインドウと対象の位置関係</title>
  <rect x="320" y="40" width="960" height="960" rx="12" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/>

  <!-- 対象のウインドウ -->
  <rect x="400" y="400" width="600" height="500" fill="#dbe7f7" stroke="#3a5f9a" stroke-width="3"/>
  <text x="700" y="700" text-anchor="middle" fill="#1f3a66">対象のウインドウ</text>
  <text x="412" y="436" fill="#1f3a66" font-size="20">(400,400)</text>
  <text x="988" y="886" text-anchor="end" fill="#1f3a66" font-size="20">(1000,900)</text>

  <!-- ゴーストのウインドウ(左上 600,150。200x300) -->
  <rect x="600" y="150" width="200" height="300" fill="#f9d2d2" fill-opacity="0.92" stroke="#b03a3a" stroke-width="3"/>
  <text x="700" y="245" text-anchor="middle" fill="#7a1f1f">ゴーストの</text>
  <text x="700" y="275" text-anchor="middle" fill="#7a1f1f">ウインドウ</text>
  <text x="700" y="310" text-anchor="middle" fill="#7a1f1f" font-size="20">200×300</text>
  <text x="612" y="182" fill="#7a1f1f" font-size="20">(600,150)</text>

  <!-- 対象の上端の中央 = お座り位置 -->
  <circle cx="700" cy="400" r="9" fill="#b03a3a"/>
  <line x1="700" y1="400" x2="830" y2="340" stroke="#444" stroke-width="2"/>
  <text x="838" y="334" fill="#222" font-size="22">お座り位置 (100,250)</text>
  <text x="838" y="362" fill="#222" font-size="22">= 対象の上端の中央 (700,400)</text>

  <!-- 基準位置(足元) -->
  <circle cx="700" cy="450" r="7" fill="#3a5f9a"/>
  <line x1="700" y1="450" x2="760" y2="500" stroke="#444" stroke-width="2"/>
  <text x="768" y="512" fill="#1f3a66" font-size="22">基準位置 (100,300)</text>
  <text x="768" y="540" fill="#1f3a66" font-size="20">（既定は下端の中央）</text>

  <!-- 式 -->
  <text x="400" y="950" fill="#222" font-size="22">ゴーストの左上 = (700,400) − (100,250) = (600,150)</text>
  <text x="400" y="978" fill="#444" font-size="20">対象の矩形の点 − お座り位置（ゴーストのウインドウの左上から）</text>
</svg>
