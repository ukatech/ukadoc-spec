<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 290" width="580" height="290" font-family="Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14">
  <title>--zorder=front と --zorder=back での、ゴーストのウインドウと対象の前後関係</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="578" height="288" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/>

  <!-- 手前→奥 -->
  <text x="26" y="52" text-anchor="middle" fill="#444">手前</text>
  <line x1="26" y1="62" x2="26" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="26" y="232" text-anchor="middle" fill="#444">奥</text>

  <!-- front -->
  <text x="150" y="30" text-anchor="middle" fill="#222" font-size="16">--zorder=front（既定）</text>
  <rect x="50" y="120" width="170" height="90" fill="#e3e3e3" stroke="#888" stroke-width="2"/>
  <rect x="70" y="90" width="170" height="90" fill="#cfe0f5" stroke="#3a5f9a" stroke-width="2"/>
  <rect x="90" y="60" width="170" height="90" fill="#f9d2d2" stroke="#b03a3a" stroke-width="2"/>
  <text x="100" y="138" fill="#7a1f1f">ゴースト</text>
  <text x="80" y="172" fill="#1f3a66">対象</text>
  <text x="60" y="203" fill="#444">その他のウインドウ</text>
  <text x="150" y="258" text-anchor="middle" fill="#222">対象より手前に出る</text>

  <!-- back -->
  <text x="430" y="30" text-anchor="middle" fill="#222" font-size="16">--zorder=back</text>
  <rect x="330" y="120" width="170" height="90" fill="#e3e3e3" stroke="#888" stroke-width="2"/>
  <rect x="350" y="90" width="170" height="90" fill="#f9d2d2" stroke="#b03a3a" stroke-width="2"/>
  <rect x="370" y="60" width="170" height="90" fill="#cfe0f5" stroke="#3a5f9a" stroke-width="2"/>
  <text x="380" y="138" fill="#1f3a66">対象</text>
  <text x="360" y="172" fill="#7a1f1f">ゴースト</text>
  <text x="340" y="203" fill="#444">その他のウインドウ</text>
  <text x="430" y="258" text-anchor="middle" fill="#222">対象のすぐ奥（直下）に入る</text>
</svg>
