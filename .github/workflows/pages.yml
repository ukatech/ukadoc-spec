name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/check_source.py
      - run: python oldstyle/build.py
      - run: python oldstyle/check.py
      - name: 翻訳版（i18n/ のある言語）のリンク検査
        run: |
          for d in i18n/*/; do
            lang=$(basename "$d")
            python oldstyle/check.py --lang="$lang"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site_old

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
